name: CI

on: [push, pull_request]

jobs:
  CommitCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
      - run: echo ${{ toJSON(github.event) }}
      - run: yarn
      - run: yarn lint
      - run: yarn test-coverage
      - run: yarn build
